# 운영 서버용 덧붙임: `docker compose -f compose.yaml -f compose.prod.yaml --profile app up -d --build`
# DB·Redis·저장소는 바깥으로 열지 않고, Nginx만 80·443을 연다. 개발용 Mailpit은 띄우지 않는다.
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
  redis:
    ports: !reset []
    restart: unless-stopped
  storage:
    ports: !reset []
    restart: unless-stopped
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_BASE_URL}
  mailpit:
    profiles: ["dev"]
  app:
    ports: !reset []
    restart: unless-stopped
    environment:
      # 같은 서버의 MinIO를 쓰므로 앱 키 = 루트 계정, 버킷·공개 읽기 정책은 앱이 처음에 만든다
      STORAGE_ACCESS_KEY: ${STORAGE_ROOT_USER}
      STORAGE_SECRET_KEY: ${STORAGE_ROOT_PASSWORD}
      BLOG_STORAGE_CREATE_BUCKET: "true"
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_PRESIGN_ENDPOINT: ${STORAGE_PUBLIC_URL}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_URL}
  nginx:
    profiles: ["app"]
    image: nginx:1.29
    depends_on: [app, storage]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN}
    volumes:
      - ${NGINX_TEMPLATES:-./deploy/nginx/templates}:/etc/nginx/templates:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
  certbot:
    profiles: ["certbot"]
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt

volumes:
  certbot-www:
  certbot-conf:
