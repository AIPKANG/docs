# 운영 서버용 덧붙임: `docker compose -f compose.yaml -f compose.prod.yaml --profile app up -d --build`
# 사진은 앱 서버 디스크(app-data 볼륨)에 둔다. DB·Redis는 바깥으로 열지 않고 Nginx만 80·443을 연다.
# MinIO(storage)와 개발용 Mailpit은 띄우지 않는다. 사진 저장소를 MinIO로 확장할 때는 DEPLOY.md "사진 저장소 확장".
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
  redis:
    ports: !reset []
    restart: unless-stopped
  storage:
    profiles: ["s3"]
  mailpit:
    profiles: ["dev"]
  app:
    ports: !reset []
    restart: unless-stopped
  nginx:
    profiles: ["app"]
    image: nginx:1.29
    depends_on: [app]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ${NGINX_TEMPLATES:-./deploy/nginx/templates}:/etc/nginx/templates:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
  certbot:
    profiles: ["certbot"]
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt

volumes:
  certbot-www:
  certbot-conf:
