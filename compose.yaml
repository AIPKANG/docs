services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: ${DB_USERNAME:-blog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-blog}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

volumes:
  postgres-data:
  redis-data:
