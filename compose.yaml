services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: ${DB_USERNAME:-blog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-blog}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

  # 003-profile: 사진 저장소. MinIO 커뮤니티 포크(04 §6-1, 버전 고정). S3 API 포트만 열고 관리 콘솔은 열지 않는다.
  # 루트 계정 기본값은 로컬 개발 전용이다(운영은 NHN MinIO, 환경 변수로만).
  storage:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER:-blogminio}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD:-blogminio-dev-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_BASE_URL:-http://localhost:8080}
    ports:
      - "${STORAGE_PORT:-9000}:9000"
    volumes:
      - storage-data:/data

  # 앱(운영 프로필) — `docker compose --profile app up -d --build`로만 뜬다. 개발할 때는 bootRun을 쓴다.
  # 값은 .env에서 읽는다(.env.example 참고). 로컬에서 전체를 시험할 때는 저장소·DB·Redis도 이 compose 것을 쓴다.
  app:
    profiles: ["app"]
    build: .
    depends_on: [postgres, redis]
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/blog
      DB_USERNAME: ${DB_USERNAME:-blog}
      DB_PASSWORD: ${DB_PASSWORD:-blog}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # 사진: 기본은 앱 서버 디스크(app-data 볼륨). STORAGE_TYPE=s3로 바꾸면 아래 MinIO 값을 쓴다(DEPLOY.md)
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_DIR: /app/data
      STORAGE_LOCAL_SECRET: ${STORAGE_LOCAL_SECRET:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://storage:9000}
      STORAGE_PRESIGN_ENDPOINT: ${STORAGE_PRESIGN_ENDPOINT:-http://localhost:9000}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-blogminio}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-blogminio-dev-secret}
      BLOG_STORAGE_CREATE_BUCKET: ${STORAGE_CREATE_BUCKET:-false}
    volumes:
      - app-data:/app/data

volumes:
  app-data:
  postgres-data:
  redis-data:
  storage-data:
