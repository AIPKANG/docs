blog:
  text:
    banned-words:
      location: classpath:policy/test-banned-words.txt
      exceptions-location: classpath:policy/test-banned-words-exceptions.txt
  # 001-auth 테스트 값(수치는 운영 기본값과 같게 두고, 시간 경과는 MutableClock·Redis TTL로 시험한다)
  auth:
    mail:
      from: no-reply@test.local
      link-base-url: http://localhost
  # 004: 예약 작업은 끄고 테스트가 직접 부른다
  post:
    autosave:
      flush-enabled: false
    empty-draft-cleanup:
      enabled: false
    trash:
      purge-enabled: false
  markdown:
    rerender:
      enabled: false
  like:
    reconcile-enabled: false
  view:
    flush-enabled: false
  trending:
    refresh-enabled: false
  moderation:
    cleanup-enabled: false
  notification:
    async: false
    cleanup-enabled: false
spring:
  # 테스트 컨텍스트가 여러 개(속성이 다른 시험) 떠도 PostgreSQL 연결 한도를 넘지 않게
  datasource:
    hikari:
      maximum-pool-size: 6
      minimum-idle: 0
  jpa:
    properties:
      hibernate:
        generate_statistics: true
  # 001-auth: 테스트용 OAuth2 더미 등록값(실제 공급자에 연결하지 않는다)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client
            client-secret: test-google-secret
          github:
            client-id: test-github-client
            client-secret: test-github-secret
logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: warn
