<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>신고 처리</title>
</head>
<body>
<main class="list-page" th:with="c=${detail.row()}, a=${detail.author()}">
    <p><a href="/admin/reports">신고 목록</a></p>
    <h1 th:text="${(c.targetType() == 'POST' ? '글' : '댓글') + ' 신고 ' + c.reportCount() + '건'}">글 신고 3건</h1>
    <!-- 신고 시점 복사본만(지금 원문은 열지 않음) -->
    <section aria-labelledby="snapshot-heading">
        <h2 id="snapshot-heading">신고 시점 내용</h2>
        <p th:if="${c.snapshotTitle() != null}"><strong th:text="${c.snapshotTitle()}">제목</strong></p>
        <pre class="snapshot" th:text="${c.snapshotContent() != null ? c.snapshotContent() : '(보관 기간이 지나 지워졌어요)'}">내용</pre>
        <p th:text="${'지금 상태: ' + detail.currentState()}">지금 상태: 공개</p>
    </section>
    <section aria-labelledby="reports-heading">
        <h2 id="reports-heading">신고 사유</h2>
        <ul>
            <li th:each="r : ${detail.reports()}">
                <span th:text="${r.reasonLabel()}">스팸</span>
                <span th:if="${r.detail() != null}" th:text="${' · ' + r.detail()}"> · 설명</span>
            </li>
        </ul>
    </section>
    <section aria-labelledby="author-heading">
        <h2 id="author-heading">작성자</h2>
        <p><span th:text="${a.nickname() != null ? a.nickname() : '탈퇴한 사용자'}">닉네임</span>
            <span th:text="${'@' + a.handle()}">@주소</span></p>
        <p class="help" th:text="${'가입 ' + a.joinedLabel() + ' · 숨김 ' + a.hiddenCount() + '건 · 정지 ' + a.suspensions().size() + '번'}">가입일</p>
    </section>
    <section th:if="${c.status() == 'PENDING'}" aria-labelledby="action-heading">
        <h2 id="action-heading">처리</h2>
        <form method="post" th:action="@{/admin/reports/{id}/hide(id=${c.id()})}">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="authorId" th:value="${a.id()}">
            <label for="hide-reason">숨김 사유</label>
            <select id="hide-reason" name="reason">
                <option th:each="r : ${reasons}" th:value="${r.name()}" th:text="${r.label()}">스팸</option>
            </select>
            <fieldset>
                <legend>작성자 정지(선택)</legend>
                <select name="suspendPeriod" aria-label="정지 기간">
                    <option value="">정지 안 함</option>
                    <option value="1">1일</option>
                    <option value="7">7일</option>
                    <option value="30">30일</option>
                    <option value="PERMANENT">영구</option>
                </select>
                <input type="text" name="suspendReason" maxlength="200" placeholder="정지 사유(정지할 때 필수)" aria-label="정지 사유">
            </fieldset>
            <button type="submit">숨기기</button>
        </form>
        <form method="post" th:action="@{/admin/reports/{id}/reject(id=${c.id()})}">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">문제없음</button>
        </form>
    </section>
</main>
</body>
</html>
