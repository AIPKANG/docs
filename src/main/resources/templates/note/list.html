<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${owner.nickname() + '님의 짧은 기록'}">짧은 기록</title>
</head>
<body>
<main class="notes-page">
    <h1 th:text="${owner.nickname() + '님의 짧은 기록'}">짧은 기록</h1>
    <p><a th:href="${'/@' + owner.handle()}">블로그로 돌아가기</a></p>
    <th:block th:if="${isOwner}"><form th:replace="~{fragments/note :: noteForm(${'/@' + owner.handle() + '/notes'})}"></form></th:block>
    <p th:if="${notes.isEmpty()}" class="empty-state">아직 짧은 기록이 없어요</p>
    <ul class="note-list">
        <th:block th:each="n : ${notes}"><li th:replace="~{fragments/note :: item(${n}, ${noteDates.get(n.id())}, ${'/@' + owner.handle() + '/notes'})}"></li></th:block>
    </ul>
    <p th:if="${nextBefore != null}"><a class="more-button" th:href="@{${'/@' + owner.handle() + '/notes'}(before=${nextBefore})}">더 보기</a></p>
</main>
</body>
</html>
