<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>같은 주제로 쓰기</title>
</head>
<body>
<main class="missions-page">
    <div class="manage-head">
        <h1>같은 주제로 쓰기</h1>
        <a th:if="${currentMemberId != null}" href="/missions/new" class="btn btn-primary btn-sm">미션 열기</a>
    </div>
    <p class="help">누군가 주제를 열면 저마다 자기 블로그에 글을 쓰고 이어 붙여요. 참여한 순서대로 릴레이가 이어져요.</p>
    <h2>진행 중</h2>
    <p th:if="${active.isEmpty()}" class="empty-state">진행 중인 미션이 없어요. 첫 미션을 열어 보세요</p>
    <ul class="mission-list">
        <li th:each="m : ${active}" class="mission-card">
            <a th:href="@{/missions/{id}(id=${m.id()})}" class="mission-title" th:text="${m.title()}">주제</a>
            <p class="help" th:text="${m.creatorNickname() + '님이 열었어요 · 참여 ' + m.participants() + '명'}">열었어요</p>
        </li>
    </ul>
    <h2 th:unless="${ended.isEmpty()}">끝난 미션</h2>
    <ul class="mission-list">
        <li th:each="m : ${ended}" class="mission-card mission-ended">
            <a th:href="@{/missions/{id}(id=${m.id()})}" class="mission-title" th:text="${m.title()}">주제</a>
            <p class="help" th:text="${'참여 ' + m.participants() + '명'}">참여</p>
        </li>
    </ul>
</main>
</body>
</html>
