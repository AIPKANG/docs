<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>내 글</title>
</head>
<body>
<main>
    <div class="manage-head">
        <h1>내 글</h1>
        <form method="post" action="/write">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">새 글</button>
        </form>
    </div>
    <p th:if="${posts.isEmpty()}" class="help">아직 쓴 글이 없어요.</p>
    <ul class="post-rows" th:unless="${posts.isEmpty()}">
        <li th:each="row : ${posts}" class="post-row">
            <a th:href="@{/write/{id}(id=${row.id()})}"
               th:text="${#strings.isEmpty(#strings.trim(row.title())) ? '(제목 없음)' : row.title()}">제목</a>
            <span class="badge" th:if="${row.status().name() == 'DRAFT'}">임시저장</span>
            <span class="badge" th:if="${row.status().name() == 'PUBLISHED'}">발행</span>
            <span class="badge badge-editing" th:if="${row.editing()}">수정 중</span>
            <span class="badge" data-visibility-badge th:text="${row.visibility() == 'PRIVATE' ? '🔒 나만 보기' : '🌐 전체 공개'}">🌐 전체 공개</span>
            <button type="button" class="visibility-toggle" th:if="${row.status().name() == 'PUBLISHED'}"
                    th:attr="data-post-id=${row.id()},data-visibility=${row.visibility()}"
                    th:text="${row.visibility() == 'PRIVATE' ? '전체 공개로' : '나만 보기로'}">나만 보기로</button>
            <time class="help" th:attr="datetime=${row.updatedAt()}"
                  th:text="${#temporals.format(row.updatedAt(), 'yyyy-MM-dd HH:mm', 'Asia/Seoul')}">시각</time>
        </li>
    </ul>
    <p id="manage-notice" class="notice" role="status" hidden></p>
    <script src="/js/post/manage.js" defer></script>
</main>
</body>
</html>
