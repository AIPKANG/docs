<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${owner.nickname()}">블로그</title>
</head>
<body>
<main class="list-page">
    <div class="blog-cover" aria-hidden="true"></div>
    <header class="blog-header profile-header">
        <th:block th:replace="~{fragments/avatar :: avatar(${owner.avatar()}, 96)}"></th:block>
        <div class="profile-text">
            <h1 th:replace="~{fragments/author :: byline(${author})}">닉네임 @주소</h1>
            <!-- 소개는 글자로만(이스케이프), 줄바꿈만 살리고 자동 링크 없음(003 FR-009·FR-010) -->
            <p class="profile-bio" th:if="${owner.bio() != null}" th:text="${owner.bio()}">소개</p>
            <p class="help">
                <span th:text="${'공개 글 ' + publicCount}">공개 글 24</span> ·
                <a th:href="${'/@' + owner.handle() + '/followers'}" th:text="${'팔로워 ' + followCounts.followers()}">팔로워 12</a> ·
                <a th:href="${'/@' + owner.handle() + '/following'}" th:text="${'팔로잉 ' + followCounts.following()}">팔로잉 30</a>
            </p>
            <!-- 018 팔로우 버튼(내 블로그에서는 없음) -->
            <p th:unless="${isOwner}">
                <th:block th:replace="~{fragments/follow :: button(${owner.handle()}, ${followingOwner}, ${currentMemberId != null}, ${loginRedirect}, ${'/@' + owner.handle()})}"></th:block>
                <!-- 025 강성찬 개인 확장: 친구 요청 -->
                <th:block th:replace="~{fragments/friend :: button(${owner.handle()}, ${friendStatus}, ${currentMemberId != null}, ${loginRedirect}, ${'/@' + owner.handle()})}"></th:block>
            </p>
            <p class="follow-message help" role="status" hidden></p>
        </div>
    </header>
    <!-- 031 강성찬 개인 확장: 잔디·스트릭(최근 1년, 공개 글·공개 글 댓글만) -->
    <section th:if="${grass != null}" class="grass" aria-labelledby="grass-heading">
        <h2 id="grass-heading" class="grass-title">기록
            <span class="grass-streak" th:if="${grass.currentStreak() > 0}" th:text="${'🔥 ' + grass.currentStreak() + '일 연속'}">🔥 3일 연속</span>
            <span class="help" th:text="${'최근 1년 ' + grass.activeDays() + '일 · 최고 ' + grass.bestStreak() + '일 연속'}">최근 1년</span></h2>
        <div class="grass-grid" role="img" th:attr="aria-label=${'최근 1년 동안 ' + grass.activeDays() + '일 기록, 최고 ' + grass.bestStreak() + '일 연속'}">
            <div class="grass-week" th:each="w : ${grass.weeks()}">
                <span th:each="d : ${w}" th:class="${'grass-day grass-' + d.level()}" th:title="${d.label()}"></span>
            </div>
        </div>
    </section>
    <!-- 033 강성찬 개인 확장: 짧은 기록 -->
    <section th:if="${recentNotes != null and (!recentNotes.isEmpty() or isOwner)}" class="notes-box" aria-labelledby="notes-heading">
        <h2 id="notes-heading" class="grass-title">짧은 기록 <a class="help" th:href="${'/@' + owner.handle() + '/notes'}">모두 보기</a></h2>
        <th:block th:if="${isOwner}"><form th:replace="~{fragments/note :: noteForm(${'/@' + owner.handle()})}"></form></th:block>
        <ul class="note-list">
            <th:block th:each="n : ${recentNotes}"><li th:replace="~{fragments/note :: item(${n}, ${noteDates.get(n.id())}, ${'/@' + owner.handle()})}"></li></th:block>
        </ul>
    </section>
    <!-- 013 블로그 태그 줄(처음 10개 + 태그 더 보기)과 필터 -->
    <nav class="blog-tags" th:unless="${blogTags.isEmpty()}" aria-label="이 블로그의 태그">
        <th:block th:each="t, st : ${blogTags}" th:if="${st.index < 10}">
            <a class="tag" th:href="@{'/@' + ${owner.handle()}(tag=${t.name()})}" th:text="${'#' + t.name() + ' ' + t.postCount()}">#태그 1</a>
        </th:block>
        <details th:if="${blogTags.size() > 10}">
            <summary>태그 더 보기</summary>
            <th:block th:each="t, st : ${blogTags}" th:if="${st.index >= 10}">
                <a class="tag" th:href="@{'/@' + ${owner.handle()}(tag=${t.name()})}" th:text="${'#' + t.name() + ' ' + t.postCount()}">#태그 1</a>
            </th:block>
        </details>
    </nav>
    <p th:if="${filterTag != null}" class="tag-filter">
        <span th:text="${'#' + filterTag + ' 글'}">#태그 글</span>
        <a th:href="${'/@' + owner.handle()}">필터 해제</a>
    </p>
    <p th:if="${continued}"><a th:href="${'/@' + owner.handle()}">처음부터 보기</a></p>
    <th:block th:if="${cards.isEmpty() and !continued and filterTag == null}">
        <p class="empty-state" th:unless="${isOwner}">아직 공개한 글이 없어요</p>
        <div class="empty-state" th:if="${isOwner}">첫 글을 써 보세요
            <form method="post" action="/write" class="inline-form">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">글쓰기</button>
            </form>
        </div>
    </th:block>
    <div class="card-grid" id="card-grid">
        <th:block th:each="card : ${cards}">
            <article th:replace="~{fragments/post-card :: card(${card}, ${cardDates.get(card.id())}, false)}"></article>
        </th:block>
    </div>
    <div th:replace="~{fragments/post-card :: more(${nextCursor}, ${listApi}, false, ${!cards.isEmpty()})}"></div>
    <script src="/js/post/list-more.js" defer></script>
    <script src="/js/follow/follow.js" defer></script>
</main>
</body>
</html>
