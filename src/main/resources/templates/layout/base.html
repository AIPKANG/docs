<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:replace="${title}">블로그</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body { margin: 0; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
               line-height: 1.6; color: #1f2328; background: #fff; overflow-wrap: anywhere; }
        main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
        img { max-width: 100%; height: auto; }
        a { color: #0969da; }
        .site-header { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px;
                       justify-content: space-between; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #d0d7de; }
        .site-header nav { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .site-header form { margin: 0; }
        .auth-form .field { margin: 16px 0; }
        .auth-form input[type=email], .auth-form input[type=text], .auth-form input[type=password] { width: 100%; max-width: 420px; padding: 8px; }
        .handle-input { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .handle-input input { flex: 1 1 160px; min-width: 0; }
        .field-error, .form-error { color: #cf222e; }
        .help { color: #57606a; font-size: 0.9em; }
        .warning { color: #9a6700; }
        .notice { background: #ddf4ff; padding: 8px 12px; }
        .password-rules { padding-left: 1.2em; font-size: 0.9em; }
        /* 003 프로필: 아이콘 8색은 흰 글자와 대비 4.5:1 이상(라이트·다크 같음) */
        .avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; flex: none;
                  object-fit: cover; color: #fff; font-weight: 600; line-height: 1; overflow: hidden; vertical-align: middle; }
        .avatar-c0 { background: #0B5CAD; } .avatar-c1 { background: #1A7F37; } .avatar-c2 { background: #8250DF; }
        .avatar-c3 { background: #BF3989; } .avatar-c4 { background: #9A6700; } .avatar-c5 { background: #CF222E; }
        .avatar-c6 { background: #0E7490; } .avatar-c7 { background: #57606A; }
        .profile-header { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
        .profile-text { flex: 1 1 200px; min-width: 0; }
        .profile-bio { white-space: pre-line; margin: 4px 0 0; }
        .settings section { border-top: 1px solid #d0d7de; padding: 8px 0 16px; }
        .settings .field { margin: 12px 0; }
        .settings input[type=text], .settings input[type=password], .settings textarea { width: 100%; max-width: 480px; padding: 8px; font: inherit; }
        .settings textarea { min-height: 6.5em; resize: vertical; }
        .settings .readonly { color: #57606a; }
        .profile-image-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .cropper { max-width: 100%; }
        .cropper canvas { max-width: 100%; height: auto; touch-action: none; border-radius: 4px; background: #eaeef2; cursor: grab; }
        .status-ok { color: #1a7f37; }
        /* 004 편집 화면·비교 창. hidden 속성은 display를 지정한 클래스보다 우선한다 */
        [hidden] { display: none !important; }
        .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        .editor input[type=text] { width: 100%; padding: 8px; font: inherit; font-size: 1.4em; border: 0; border-bottom: 1px solid #d0d7de; }
        .editor textarea { width: 100%; min-height: 60vh; padding: 8px; font: 1em/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; }
        .editor-bar { display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; position: sticky; bottom: 0; background: #fff; padding: 8px 0; }
        .editor-actions { display: flex; gap: 8px; }
        .save-status { margin: 0; color: #57606a; }
        .banner-warning { background: #fff8c5; border: 1px solid #d4a72c; padding: 8px 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        dialog#compare-dialog { width: min(1100px, 96vw); max-height: 90vh; padding: 12px; }
        .compare-head, .compare-nav, .compare-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
        .compare-head h2 { font-size: 1.1em; margin: 0; }
        .compare-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .compare-label { margin: 4px 0; font-weight: 600; }
        .compare-body { max-height: 55vh; overflow: auto; border: 1px solid #d0d7de; font: 0.9em/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
        .diff-row { display: grid; grid-template-columns: 1fr 1fr; }
        .diff-cell { padding: 0 6px; white-space: pre-wrap; min-height: 1.5em; border-right: 1px solid #eaeef2; }
        .diff-del { background: #ffebe9; } .diff-add { background: #dafbe1; }
        .diff-del mark { background: #ffaba8; } .diff-add mark { background: #6fdd8b; }
        .diff-sign { user-select: none; color: #57606a; }
        .diff-current { outline: 2px solid #0969da; }
        .diff-fold { display: block; width: 100%; text-align: left; background: #f6f8fa; border: 0; padding: 2px 6px; color: #57606a; }
        .diff-title { padding: 4px 6px; border-bottom: 1px solid #d0d7de; }
        .overwrite-confirm { border-top: 1px solid #d0d7de; margin-top: 8px; padding-top: 8px; }
        @media (max-width: 719px) { .compare-columns { display: none; } .diff-row { grid-template-columns: 1fr; } .diff-cell.diff-same-right { display: none; } }
        .manage-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .post-rows { list-style: none; padding: 0; }
        .post-row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid #eaeef2; }
        .badge { font-size: 0.8em; border: 1px solid #d0d7de; border-radius: 999px; padding: 0 8px; color: #57606a; }
        .badge-editing { border-color: #d4a72c; color: #7d4e00; }
    </style>
</head>
<body>
<header class="site-header">
    <a href="/">블로그</a>
    <nav>
        <th:block th:if="${currentMemberId != null}">
            <form method="post" action="/write">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">새 글</button>
            </form>
            <a href="/manage/posts">내 글</a>
            <a href="/settings">설정</a>
            <form method="post" action="/logout" data-logout-form th:attr="data-member-id=${currentMemberId}">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">로그아웃</button>
            </form>
        </th:block>
        <th:block th:unless="${currentMemberId != null}">
            <a href="/login">로그인</a>
            <a href="/signup">가입하기</a>
        </th:block>
    </nav>
</header>
<div hidden id="logout-cleanup" th:if="${logoutCleanupMemberId != null}" th:attr="data-member-id=${logoutCleanupMemberId}"></div>
<main th:replace="${content}">
</main>
<script src="/js/auth/auth-logout.js" defer></script>
</body>
</html>
