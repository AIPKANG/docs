<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>친구 그룹</title>
</head>
<body>
<main class="friends-page">
    <h1>친구 그룹</h1>
    <p class="help">친구를 그룹으로 묶으면, 글을 "그룹 공개"로 올려 고른 그룹에만 보여 줄 수 있어요. 그룹은 나만 볼 수 있어요.
        <a href="/settings/friends">친구 관리</a></p>

    <form method="post" action="/settings/groups" class="group-create">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="group-name">새 그룹 이름</label>
        <input id="group-name" name="name" type="text" maxlength="20" required placeholder="예: 대학 친구">
        <button type="submit" class="btn btn-primary btn-sm">그룹 만들기</button>
    </form>

    <p th:if="${groups.isEmpty()}" class="help">아직 그룹이 없어요</p>
    <section th:each="g : ${groups}" class="group-card" th:attr="aria-label=${g.name()}">
        <h2 th:text="${g.name() + ' ' + g.members().size() + '명'}">그룹 0명</h2>
        <ul class="follow-list">
            <li th:each="m : ${g.members()}" class="follow-row">
                <th:block th:replace="~{fragments/avatar :: avatar(${m.avatar()}, 32)}"></th:block>
                <div class="follow-text"><p><span th:text="${m.nickname()}">닉네임</span>
                    <a th:href="${'/@' + m.handle()}" th:text="${'@' + m.handle()}">@주소</a></p></div>
                <form method="post" th:action="@{/settings/groups/{g}/members/{m}/remove(g=${g.id()},m=${m.memberId()})}">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn-text btn-sm">빼기</button>
                </form>
            </li>
        </ul>
        <form method="post" th:action="@{/settings/groups/{g}/members(g=${g.id()})}" th:if="${!friends.isEmpty()}" class="group-add">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label th:for="${'add-' + g.id()}" class="visually-hidden">넣을 친구</label>
            <select th:id="${'add-' + g.id()}" name="memberId">
                <option th:each="f : ${friends}" th:value="${f.memberId()}" th:text="${f.nickname() + ' @' + f.handle()}">친구</option>
            </select>
            <button type="submit" class="btn btn-sm">친구 넣기</button>
        </form>
        <p th:if="${friends.isEmpty()}" class="help">그룹에는 친구만 넣을 수 있어요. 먼저 친구를 맺어 보세요</p>
        <form method="post" th:action="@{/settings/groups/{g}/delete(g=${g.id()})}">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-danger btn-sm">그룹 지우기</button>
        </form>
    </section>
</main>
</body>
</html>
