<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>탈퇴 신청한 계정이에요</title>
</head>
<body>
<main class="auth-page auth-page-single">
    <h1>탈퇴 신청한 계정이에요</h1>
    <p th:if="${restoreDeadline != null}" th:text="${restoreDeadline + '까지 복구할 수 있어요 (' + restoreDaysLeft + '일 남음)'}">복구 기한</p>
    <p>복구하면 블로그와 글이 탈퇴 전 그대로 돌아와요. 복구하지 않으면 기한이 지난 뒤 계정이 정리돼요.</p>
    <!-- 로그인만으로는 복구되지 않는다: [복구하기]를 눌러야 한다(023 FR-021) -->
    <form method="post" th:action="@{/account/restore}">
        <button type="submit" class="btn btn-primary">복구하기</button>
    </form>
    <form method="post" th:action="@{/logout}" data-logout-form th:attr="data-member-id=${currentMemberId}">
        <button type="submit">로그아웃</button>
    </form>
</main>
</body>
</html>
