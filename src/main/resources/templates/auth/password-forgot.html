<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>비밀번호 찾기</title>
</head>
<body>
<main>
    <h1>비밀번호 찾기</h1>
    <p class="notice" th:if="${sent != null}" th:text="${sent}" role="status">안내</p>
    <p>가입한 이메일을 입력하면 비밀번호를 다시 정할 수 있는 링크를 보내 드려요. 링크는 30분 동안 한 번만 쓸 수 있어요.</p>
    <form method="post" th:action="@{/password/forgot}" class="auth-form">
        <div class="field">
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <button type="submit">안내 메일 받기</button>
    </form>
    <p><a href="/login">로그인</a></p>
</main>
</body>
</html>
