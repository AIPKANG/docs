<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${valid} ? '새 비밀번호 정하기' : '링크가 만료됐어요'">비밀번호 재설정</title>
</head>
<body>
<main>
    <th:block th:if="${valid}">
        <h1>새 비밀번호 정하기</h1>
        <form method="post" th:action="@{/password/reset}" class="auth-form" novalidate>
            <input type="hidden" name="token" th:value="${token}">
            <div class="field">
                <label for="password">새 비밀번호 <span class="help">(8~16자, 최대 16자)</span></label>
                <input id="password" name="password" type="password" autocomplete="new-password" required
                       data-password-rules="#password-rules">
                <ul id="password-rules" class="password-rules" aria-live="polite">
                    <li data-rule="length">8~16자 (최대 16자)</li>
                    <li data-rule="letter">영문 1자 이상</li>
                    <li data-rule="digit">숫자 1자 이상</li>
                    <li data-rule="special">특수문자 1자 이상</li>
                    <li data-rule="allowed">영문·숫자·특수문자만 (공백·한글 불가)</li>
                </ul>
                <ul class="field-error" th:if="${!passwordErrors.isEmpty()}" role="alert">
                    <li th:each="msg : ${passwordErrors}" th:text="${msg}">오류</li>
                </ul>
            </div>
            <div class="field">
                <label for="passwordConfirm">새 비밀번호 확인</label>
                <input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required>
            </div>
            <button type="submit">비밀번호 바꾸기</button>
        </form>
        <script src="/js/auth/password-rules.js" defer></script>
    </th:block>
    <th:block th:unless="${valid}">
        <h1>링크가 만료됐어요</h1>
        <p>이미 사용했거나 30분이 지난 링크예요.</p>
        <p><a href="/password/forgot">[비밀번호 찾기]</a></p>
    </th:block>
</main>
</body>
</html>
