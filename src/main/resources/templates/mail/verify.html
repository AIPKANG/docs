<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>이메일 인증</title>
</head>
<body>
<p>블로그에 가입해 주셔서 고마워요.</p>
<p>아래 링크를 눌러 이메일 인증을 완료해 주세요. 링크는 <span th:text="${hours}">24</span>시간 동안 한 번만 쓸 수 있어요.</p>
<p><a th:href="${link}" th:text="${link}">인증 링크</a></p>
<p>직접 가입하지 않았다면 이 메일은 무시해 주세요.</p>
</body>
</html>
