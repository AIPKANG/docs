<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 탈퇴 신청 접수</title>
</head>
<body>
<p>회원 탈퇴 신청을 받았어요.</p>
<p th:text="${deadline + '까지 로그인해서 [복구하기]를 누르면 계정을 되살릴 수 있어요.'}">복구 기한</p>
<p>그동안 블로그와 글은 다른 사람에게 보이지 않고, 기한이 지나면 글·사진·좋아요가 완전히 삭제돼요.</p>
</body>
</html>
