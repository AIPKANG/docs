# 개발 프로필: 메일은 Mailpit(compose.yaml의 mailpit, 웹 8025)
spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  # OAuth 앱을 아직 등록하지 않아도 기동되게 하는 자리표시 값(비밀 아님). 실제 소셜 로그인은 환경 변수로 넣는다.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-not-set}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-not-set}
          github:
            client-id: ${GITHUB_CLIENT_ID:github-client-id-not-set}
            client-secret: ${GITHUB_CLIENT_SECRET:github-client-secret-not-set}

blog:
  auth:
    mail:
      from: no-reply@localhost
      link-base-url: ${APP_BASE_URL:http://localhost:8080}
