# 운영 프로필: 메일은 Gmail SMTP(587 STARTTLS, 앱 비밀번호 — research R-13).
# 필요한 환경 변수: MAIL_USERNAME, MAIL_PASSWORD(Google 앱 비밀번호), GOOGLE_CLIENT_ID/SECRET, GITHUB_CLIENT_ID/SECRET, APP_BASE_URL,
# 사진 저장: 기본은 서버 디스크(STORAGE_TYPE=local, STORAGE_LOCAL_SECRET, STORAGE_LOCAL_DIR).
# MinIO로 확장하면 STORAGE_TYPE=s3 와 STORAGE_ENDPOINT, STORAGE_PUBLIC_BASE_URL, STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY.
# 하나라도 없으면 기동하지 않는다(RequiredSecretsCheck).
spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

blog:
  auth:
    mail:
      # 보내는 주소는 Gmail 계정 주소로 고정
      from: ${MAIL_USERNAME:}
      link-base-url: ${APP_BASE_URL:}
  # 사진 저장소: 처음에는 서버 디스크(local), 나중에 NHN MinIO(s3)로 확장(DEPLOY.md "사진 저장소 확장").
  # s3일 때 버킷·정책은 미리 만들어 둔다(create-bucket=false)
  storage:
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_LOCAL_DIR:/app/data}
    endpoint: ${STORAGE_ENDPOINT:}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    create-bucket: false

# 사진 디스크(볼륨)의 남은 공간도 상태 확인에 넣는다(10MB 아래면 DOWN)
management:
  health:
    diskspace:
      path: ${STORAGE_LOCAL_DIR:/app/data}
      threshold: 10MB
