spring:
  application:
    name: blog
  profiles:
    # 프로필을 정하지 않고 실행하면 개발 프로필(Mailpit). 운영은 SPRING_PROFILES_ACTIVE=prod
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/blog}
    username: ${DB_USERNAME:blog}
    password: ${DB_PASSWORD:blog}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  # 001-auth: 로그인 세션 = Spring Session Redis 인덱스 저장소(principal 이름 = memberId, research R-3)
  session:
    timeout: ${blog.auth.session-timeout}
    data:
      redis:
        repository-type: indexed
  # 001-auth: 소셜 로그인. 비밀값은 환경 변수로만(헌법 IV)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,email,profile
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope: read:user,user:email

server:
  forward-headers-strategy: native

blog:
  # 001-auth 정책 수치(헌법 II). AuthProperties 참고
  auth:
    verify-token-ttl: 24h
    reset-token-ttl: 30m
    verify-resend:
      per-minute: 1
      per-day: 10
    reset-request:
      email-per-minute: 1
      email-per-day: 10
      ip-per-hour: 20
    login:
      max-failures: 5
      lock-duration: 15m
      ip-per-minute: 20
    session-timeout: 14d
    pending-social-ttl: 10m
    password:
      local-part-min-length: 3
      bcrypt-strength: 10
      common-passwords-location: classpath:security/common-passwords.txt
    mail:
      from: no-reply@localhost
      link-base-url: http://localhost:8080
    # 003-profile: 비밀번호 변경 시 현재 비밀번호 연속 실패 잠금(11 §6-2)
    password-change:
      max-failures: 5
      lock-duration: 15m
  account:
    handle:
      prefill-max-body-length: 30
      suggestion-batch-size: 20
      # FR-004 (08 §5) 34개. 서비스 이름 확정 시 추가(research U-1)
      reserved:
        - admin
        - administrator
        - root
        - system
        - official
        - support
        - help
        - about
        - terms
        - privacy
        - api
        - login
        - logout
        - signup
        - settings
        - me
        - write
        - search
        - tag
        - tags
        - notifications
        - manage
        - static
        - assets
        - images
        - mail
        - www
        - blog
        - user
        - users
        - "null"
        - undefined
        - devlog
        - teamblog
    nickname:
      change-cooldown: 30d
      # FR-017 (09 §5) 15개
      reserved:
        - 관리자
        - 운영자
        - 운영진
        - 운영팀
        - 고객센터
        - 공식
        - 매니저
        - 스태프
        - admin
        - administrator
        - official
        - staff
        - manager
        - system
        - root
    availability:
      per-ip-per-minute: 30
  text:
    banned-words:
      location: classpath:policy/banned-words.txt
      exceptions-location: classpath:policy/banned-words-exceptions.txt
  # 003-profile: 사진 저장소(MinIO·S3 호환, research R-5). 키는 환경 변수로만(헌법 IV)
  storage:
    endpoint: http://localhost:${STORAGE_PORT:9000}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:${blog.storage.endpoint}}
    bucket: blog-images
    region: us-east-1
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    presign-ttl: 5m
    # 시작할 때 버킷·익명 읽기 정책을 만든다(개발·테스트만 true)
    create-bucket: false
    # 008: s3(기본) | local(저장소를 띄울 수 없는 환경). local은 서명 키를 환경 변수로
    type: ${STORAGE_TYPE:s3}
    local-dir: ${STORAGE_LOCAL_DIR:./build/local-images}
    local-secret: ${STORAGE_LOCAL_SECRET:}
  # 003-profile: 프로필 이미지 업로드·정리(04 §4, 11 §4). 008이 글 사진 값을 더한다
  image:
    upload-per-minute: 20
    profile:
      size: 256
      max-bytes: 1048576
    temp-ttl: 24h
    detached-ttl: 7d
    cleanup:
      enabled: true
      cron: "0 30 4 * * *"
      batch-size: 500
    # 008-image-upload: 글 사진 규격·회원별 한도(04 §4, 23 §3·§5)
    post:
      max-bytes: 10485760
      thumb-max-bytes: 1048576
      thumb-max-width: 640
      max-dimension: 10000
      gif-max-dimension: 1920
      gif-max-frames: 300
    quota-bytes: 1073741824
    daily-limit: 200
  # 003-profile: 소개·소셜 사진(11 §3·§4-2)
  profile:
    bio:
      max-length: 200
      max-lines: 4
    social-picture:
      size: 256
      allowed-hosts:
        GOOGLE: lh3.googleusercontent.com
        GITHUB: avatars.githubusercontent.com
  # 004-draft-autosave: 3단계 저장(04 §2-1)·작업본·빈 임시글 정리. PostProperties 참고
  post:
    title-max-length: 100
    content-max-length: 100000
    # 005-post-publish: 태그 최대 개수(강성찬은 5로 설정 가능), 발행 요청 식별자 보관(05 §6)
    max-tags: 10
    publish:
      idempotency-ttl: 10m
    autosave:
      buffer-ttl: 24h
      flush-enabled: true
      flush-interval: 1m
      flush-batch-size: 500
      flush-lock-ttl: 50s
      rate-limit-window: 5s
      max-body-bytes: 1048576
      redis-retry-after: 30s
    editor:
      local-save-delay: 1s
      server-save-delay: 3s
      server-save-max-interval: 30s
      retry-max: 60s
      backup-ttl: 7d
    # 011: 휴지통 30일 뒤 자동 완전 삭제, 내 글 관리 20개씩
    trash:
      retention: 30d
      purge-enabled: true
      purge-cron: "0 20 5 * * *"
      purge-batch-size: 100
    manage-page-size: 20
    empty-draft-cleanup:
      enabled: true
      cron: "0 40 4 * * *"
      min-age: 24h
      batch-size: 500
      lock-ttl: 10m
  # 007-content-sanitize: 렌더링 한도·미리보기·다시 렌더링(12 §7). MarkdownProperties 참고
  markdown:
    max-nesting: 20
    render-timeout: 1s
    site-origin: ${blog.auth.mail.link-base-url}
    preview-per-minute: 60
    rerender:
      enabled: true
      cron: "0 10 5 * * *"
      batch-size: 100
  # 014-comment: 21 §12
  comment:
    max-length: 1000
    page-size: 20
    preview-replies: 3
    create-per-minute: 10
    edit-per-minute: 20
    dedupe-window: 10s
  # 015-like: 매일 좋아요 수 보정
  like:
    reconcile-enabled: true
    reconcile-cron: "0 50 4 * * *"
  # 016-view-count: 31 §2-2·§3 (강성찬 원안은 30m·5)
  view:
    dedupe-window: 24h
    max-per-window: 1
    notice: 같은 사람은 하루에 한 번만 세요
    bot-user-agents: [bot, crawler, spider, preview, facebookexternalhit, Slackbot, kakaotalk-scrap, Discordbot, HeadlessChrome]
    per-minute: 60
    flush-enabled: true
    flush-interval: 1m
    daily-retention: 90d
    retention-cron: "0 0 5 * * *"
